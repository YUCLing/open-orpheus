name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists the PR's changed files

concurrency:
  # Superseded runs on the same PR are useless: cancel them. On main, queue
  # instead, so a run that is already building can still save its caches.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect relevant changes
    uses: $/.github/workflows/changes.yml

  lint-node:
    name: JS/TS Lint & Prettier
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.node == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run Oxlint
        run: pnpm lint:oxlint

      - name: Run ESLint (gui)
        run: pnpm lint:gui:eslint

      - name: Run Svelte check
        run: pnpm lint:gui:check

  lint-rust:
    name: Clippy & Rustfmt (${{ matrix.os }})
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve pinned Rust version
        id: toolchain
        uses: $/.github/actions/toolchain

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: ${{ steps.toolchain.outputs.rust }}
          components: clippy,rustfmt

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check Rustfmt formatting
        run: cargo fmt --all -- --check
