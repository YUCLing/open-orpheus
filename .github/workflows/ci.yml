name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect relevant changes
    uses: ./.github/workflows/changes.yml

  build:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.build == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - xcode-27
          - windows-latest
          - windows-11-arm

    uses: ./.github/workflows/build.yml
    with:
      runner: ${{ matrix.runner }}

  # Always-running gate so the ruleset has a required check even when the
  # build matrix above is skipped by the change filter.
  required:
    name: CI required
    needs: [changes, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
