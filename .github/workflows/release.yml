name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.10.2)"
        required: true
      pre_release:
        description: "Mark as pre-release"
        type: boolean
        default: false
      discussion_category:
        description: "GitHub Discussions category name (omit to skip)"
        required: false
        type: string
        default: ""
      previous_tag:
        description: "Previous tag for release notes diff (e.g. v0.10.1, omit for auto)"
        required: false
        type: string
        default: ""
      skip_commit:
        description: "Skip the version-bump commit (use when already committed manually)"
        type: boolean
        default: false

# Least privilege by default; individual jobs widen this as needed.
permissions:
  contents: read

concurrency:
  # Serialize instead of cancel: these workflows push commits or publish, so an
  # overlapping run would race the previous one's side effects.
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    outputs:
      commit-sha: ${{ steps.push.outputs.commit-sha }}

    steps:
      # Bootstrap checkout: the steps below run against this working tree.
      - name: Checkout (bootstrap)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Create app token
        id: app
        uses: $/.github/actions/create-app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          contents: write

      # Re-checkout so git push authenticates as the app.
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app.outputs.token }}
          # Explicit: the app token is used by `git push`, so the credential
          # must stay configured.
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update version in package.json
        if: ${{ !inputs.skip_commit }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json
          mv tmp.json package.json

      - name: Clean up existing release if any
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" --json isDraft -q '.isDraft' 2>/dev/null; then
            IS_DRAFT=$(gh release view "$TAG" --json isDraft -q '.isDraft')
            if [ "$IS_DRAFT" = "true" ]; then
              echo "Deleting existing draft release $TAG"
              gh release delete "$TAG" --yes
            else
              echo "::error::Release $TAG is already published. Aborting."
              exit 1
            fi
          else
            echo "No existing release found for $TAG, proceeding."
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ inputs.version }}
          PRE_RELEASE: ${{ inputs.pre_release }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          args=(--draft --generate-notes --title "v${VERSION}")
          if [ "$PRE_RELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          if [ -n "$PREVIOUS_TAG" ]; then
            args+=(--notes-start-tag "$PREVIOUS_TAG")
          fi
          gh release create "v${VERSION}" "${args[@]}"

      - name: Fetch auto-generated release notes
        if: ${{ !inputs.skip_commit }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release view "v${VERSION}" \
            --json body \
            -q '.body' > /tmp/release-notes.md

      - name: Generate changelogs (metainfo, Debian, RPM) via DeepSeek
        if: ${{ !inputs.skip_commit }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          VERSION: ${{ inputs.version }}
        run: |
          node scripts/generate-changelog.ts \
            --notes /tmp/release-notes.md \
            --version "$VERSION"

      - name: Commit and push
        if: ${{ !inputs.skip_commit }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git add package.json packaging/flatpak/metainfo.xml packaging/resources/debian/changelog packaging/resources/rpm.changelog
          git commit -m "chore: bump version to ${VERSION}" -m "[skip ci]"
          git push origin main

      - name: Capture commit SHA
        id: push
        run: echo "commit-sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.runner }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - xcode-27
          - windows-latest
          - windows-11-arm
    uses: $/.github/workflows/build.yml
    with:
      runner: ${{ matrix.runner }}
      ref: ${{ needs.prepare.outputs.commit-sha }}

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      actions: write # gh workflow run flathub.yml

    steps:
      - name: Checkout for git context
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit-sha }}
          persist-credentials: false

      - name: Create app token
        id: app
        uses: $/.github/actions/create-app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          contents: write
          discussions: ${{ inputs.discussion_category != '' && 'write' || '' }}

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: false

      - name: Flatten artifacts
        run: |
          mkdir -p release-files
          find artifacts -type f | while read f; do
            case "$f" in
              artifacts/squirrel-*/*)
                case "$f" in
                  *.exe)
                    case "$f" in
                      *arm*) arch="arm64" ;;
                      *) arch="x64" ;;
                    esac
                    basename="${f##*/}"
                    new_name="${basename%Setup.exe}${arch}.Setup.exe"
                    cp "$f" "release-files/${new_name}"
                    ;;
                esac
                ;;
              *) cp "$f" release-files/ ;;
            esac
          done

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release upload "v${VERSION}" release-files/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ inputs.version }}
          PRE_RELEASE: ${{ inputs.pre_release }}
          DISCUSSION_CATEGORY: ${{ inputs.discussion_category }}
        run: |
          args=(--draft=false)
          if [ "$PRE_RELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          if [ -n "$DISCUSSION_CATEGORY" ]; then
            args+=(--discussion-category "$DISCUSSION_CATEGORY")
          fi
          gh release edit "v${VERSION}" "${args[@]}"

      - name: Trigger Flathub publish workflow
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run flathub.yml --ref main

  cleanup:
    name: Clean up draft release on failure
    needs: [prepare, build, publish]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    steps:
      - name: Checkout (bootstrap)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create app token
        id: app
        uses: $/.github/actions/create-app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          contents: write

      - name: Delete draft release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh release view "v${VERSION}" --json isDraft -q '.isDraft' 2>/dev/null | grep -q true; then
            echo "Deleting draft release v${VERSION}"
            gh release delete "v${VERSION}" --yes
          fi
