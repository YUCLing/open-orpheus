name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.10.2)"
        required: true
      pre_release:
        description: "Mark as pre-release"
        type: boolean
        default: false
      discussion_category:
        description: "GitHub Discussions category name (omit to skip)"
        required: false
        type: string
        default: ""
      previous_tag:
        description: "Previous tag for release notes diff (e.g. v0.10.1, omit for auto)"
        required: false
        type: string
        default: ""
      skip_commit:
        description: "Skip the version-bump commit (use when already committed manually)"
        type: boolean
        default: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit-sha: ${{ steps.push.outputs.commit-sha }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update version in package.json
        if: ${{ !inputs.skip_commit }}
        run: |
          jq --arg v "${{ inputs.version }}" '.version = $v' package.json > tmp.json
          mv tmp.json package.json

      - name: Clean up existing release if any
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}"
          if gh release view "$TAG" --json isDraft -q '.isDraft' 2>/dev/null; then
            IS_DRAFT=$(gh release view "$TAG" --json isDraft -q '.isDraft')
            if [ "$IS_DRAFT" = "true" ]; then
              echo "Deleting existing draft release $TAG"
              gh release delete "$TAG" --yes
            else
              echo "::error::Release $TAG is already published. Aborting."
              exit 1
            fi
          else
            echo "No existing release found for $TAG, proceeding."
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --draft \
            --generate-notes \
            --title "v${{ inputs.version }}" \
            ${{ inputs.pre_release && '--prerelease' || '' }} \
            ${{ inputs.previous_tag && format('--notes-start-tag "{0}"', inputs.previous_tag) || '' }} \

      - name: Fetch auto-generated release notes
        if: ${{ !inputs.skip_commit }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "v${{ inputs.version }}" \
            --json body \
            -q '.body' > /tmp/release-notes.md

      - name: Generate changelogs (metainfo, Debian, RPM) via DeepSeek
        if: ${{ !inputs.skip_commit }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          node --experimental-strip-types scripts/generate-changelog.ts \
            --notes /tmp/release-notes.md \
            --version "${{ inputs.version }}"

      - name: Commit and push
        if: ${{ !inputs.skip_commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json packaging/flatpak/metainfo.xml packaging/resources/debian/changelog packaging/resources/rpm.changelog
          git commit -m "chore: bump version to ${{ inputs.version }}"
          git push origin main

      - name: Capture commit SHA
        id: push
        run: echo "commit-sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.runner }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
          - windows-11-arm
    uses: ./.github/workflows/build.yml
    with:
      runner: ${{ matrix.runner }}
      ref: ${{ needs.prepare.outputs.commit-sha }}

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
      actions: write

    steps:
      - name: Checkout for git context
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit-sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: false

      - name: Flatten artifacts
        run: |
          mkdir -p release-files
          find artifacts -type f | while read f; do
            case "$f" in
              artifacts/squirrel-*/*)
                case "$f" in
                  *.exe)
                    case "$f" in
                      *arm*) arch="arm64" ;;
                      *) arch="x64" ;;
                    esac
                    basename="${f##*/}"
                    new_name="${basename%Setup.exe}${arch}.Setup.exe"
                    cp "$f" "release-files/${new_name}"
                    ;;
                esac
                ;;
              *) cp "$f" release-files/ ;;
            esac
          done

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ inputs.version }}" release-files/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${{ inputs.version }}" \
            --draft=false \
            ${{ inputs.pre_release && '--prerelease' || '' }} \
            ${{ inputs.discussion_category && format('--discussion-category "{0}"', inputs.discussion_category) || '' }}

      - name: Trigger Flathub publish workflow
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run flathub.yml --ref main

  cleanup:
    name: Clean up draft release on failure
    needs: [prepare, build, publish]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ inputs.version }}" --json isDraft -q '.isDraft' 2>/dev/null | grep -q true; then
            echo "Deleting draft release v${{ inputs.version }}"
            gh release delete "v${{ inputs.version }}" --yes
          fi
