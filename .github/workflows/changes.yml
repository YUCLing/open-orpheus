name: Detect Changes

on:
  workflow_call:
    outputs:
      node:
        description: JS, TypeScript, Svelte, tooling, or formatting files changed
        value: ${{ jobs.changes.outputs.node }}
      rust:
        description: Rust files or Cargo metadata changed
        value: ${{ jobs.changes.outputs.rust }}
      build:
        description: Application bundle inputs changed
        value: ${{ jobs.changes.outputs.build }}
      flathub:
        description: Flatpak manifest inputs (packaging, toolchains, lockfiles) changed
        value: ${{ jobs.changes.outputs.flathub }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.filter.outputs.node }}
      rust: ${{ steps.filter.outputs.rust }}
      build: ${{ steps.filter.outputs.build }}
      flathub: ${{ steps.filter.outputs.flathub }}

    steps:
      - name: Checkout repository
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed files
        if: ${{ github.event_name != 'workflow_dispatch' }}
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            node:
              - ".github/workflows/changes.yml"
              - ".github/workflows/lint.yml"
              - ".github/workflows/test.yml"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "eslint.config.ts"
              - ".prettierignore"
              - ".prettierrc"
              - "tsconfig.json"
              - "vitest.config.ts"
              - "forge.config.ts"
              - "forge.env.d.ts"
              - "vite*.config.ts"
              - "build/**"
              - "gui/**"
              - "src/**"
              - "types/**"
              - "__test__/**"
              - "__mocks__/**"
              - "modules/**/*.ts"
              - "modules/**/package.json"
              - "modules/**/tsconfig.json"
              - "modules/**/tsdown.config.ts"
              - "packaging/**/*.ts"
              - "packaging/**/*.d.ts"
              - "scripts/**/*.ts"
              - "patches/**"
            rust:
              - ".github/workflows/changes.yml"
              - ".github/workflows/lint.yml"
              - ".github/workflows/test.yml"
              - ".config/nextest.toml"
              - "Cargo.toml"
              - "Cargo.lock"
              - "modules/**/Cargo.toml"
              - "modules/**/*.rs"
            build:
              - ".github/workflows/changes.yml"
              - ".github/workflows/ci.yml"
              - ".github/workflows/build.yml"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "Cargo.toml"
              - "Cargo.lock"
              - "forge.config.ts"
              - "forge.env.d.ts"
              - "vite*.config.ts"
              - "tsconfig.json"
              - "src/**"
              - "gui/**"
              - "types/**"
              - "modules/**"
              - "scripts/**"
              - "packaging/**"
              - "patches/**"
              - "assets/**"
              - "LICENSE"
              - "versions.json"
            # Only the inputs that shape the generated manifest: a full source
            # build is expensive, so app source changes don't trigger it.
            flathub:
              - ".github/workflows/changes.yml"
              - ".github/workflows/test.yml"
              - ".github/workflows/flathub.yml"
              - ".github/flatpak-lint-exceptions.json"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "Cargo.toml"
              - "Cargo.lock"
              - "packaging/**"
              - "scripts/build-flatpak-builder.ts"
