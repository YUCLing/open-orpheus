name: Build Bundles

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub Actions runner label
        required: true
        type: string
      ref:
        description: Git ref to checkout (defaults to caller's ref)
        required: false
        type: string
        default: ""

jobs:
  build:
    name: Build on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ vars.RUST_VERSION || 'stable' }}
          target: wasm32-unknown-unknown

      - name: Install dependencies
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          version=$(awk '/^wasm-bindgen =/ { gsub(/"/, "", $3); print $3; exit }' Cargo.toml)
          cargo install "wasm-bindgen-cli@$version"

      - name: Install cross-compilation toolchain
        # napi-rs `build -x` runs `cargo zigbuild` for every non-Windows target
        # (even when the target matches the host). cargo-zigbuild resolves zig
        # itself, preferring the PyPI `ziglang` package (`python -m ziglang`) and
        # falling back to a `zig` on PATH
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo_zigbuild_version=$(sed -n 's/.*CARGO_ZIGBUILD_VERSION = "\([^"]*\)".*/\1/p' packaging/common/toolchain.ts)
          zig_version=$(sed -n 's/.*ZIG_VERSION = "\([^"]*\)".*/\1/p' packaging/common/toolchain.ts)
          cargo install --locked "cargo-zigbuild@$cargo_zigbuild_version"
          # --break-system-packages: the Ubuntu images are PEP 668 managed.
          pip install --break-system-packages "ziglang==$zig_version"

      - name: Build native modules
        run: pnpm build:modules

      - name: Install packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y flatpak flatpak-builder appstream elfutils debhelper-compat

      - name: Set up Flatpak runtimes
        if: runner.os == 'Linux'
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08 org.electronjs.Electron2.BaseApp//26.08

      - name: Validate metainfo
        if: runner.os == 'Linux'
        run: appstreamcli validate packaging/flatpak/metainfo.xml

      - name: Build application bundles
        run: pnpm make
        env:
          EXTRACT_LICENSES_TO: out/license

      - name: Upload licenses
        uses: actions/upload-artifact@v7
        with:
          name: licenses-${{ inputs.runner }}
          path: out/license/**
          if-no-files-found: ignore

      - name: Upload flatpak
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-${{ inputs.runner }}
          path: out/make/flatpak/**
          if-no-files-found: ignore

      - name: Upload deb
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ inputs.runner }}
          path: out/make/deb/**
          if-no-files-found: ignore

      - name: Upload rpm
        uses: actions/upload-artifact@v7
        with:
          name: rpm-${{ inputs.runner }}
          path: out/make/rpm/**
          if-no-files-found: ignore

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: AppImage-${{ inputs.runner }}
          path: out/make/AppImage/**
          if-no-files-found: ignore

      - name: Upload squirrel
        uses: actions/upload-artifact@v7
        with:
          name: squirrel-${{ inputs.runner }}
          path: out/make/squirrel.windows/**
          if-no-files-found: ignore

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: zip-${{ inputs.runner }}
          path: out/make/zip/**
          if-no-files-found: ignore
