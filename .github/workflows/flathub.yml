name: Publish to Flathub

on:
  workflow_dispatch:

# Least privilege by default; the publish job widens this for its own needs.
permissions:
  contents: read

concurrency:
  # Serialize instead of cancel: these workflows push commits or publish, so an
  # overlapping run would race the previous one's side effects.
  group: flathub
  cancel-in-progress: false

env:
  FLATHUB_REPO: flathub/io.github.yucling.open-orpheus
  FLATHUB_BASE_BRANCH: master

jobs:
  build-manifest:
    name: Generate Flatpak builder manifest
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Determine source tag and compute SHA256
        id: source
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          TAG="v${VERSION}"
          URL="https://github.com/${REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          SHA256=$(curl -sL "$URL" | sha256sum | cut -d' ' -f1)
          echo "flatpak_source=${URL}+${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Install flatpak-node-generator and flatpak-cargo-generator
        run: |
          COMMIT=9d86d336a39b9af38b86f114b6ce5820fe260f91
          TOOLS_DIR=/tmp/flatpak-builder-tools
          git clone --filter=blob:none https://github.com/flatpak/flatpak-builder-tools.git "$TOOLS_DIR"
          git -C "$TOOLS_DIR" checkout "$COMMIT"

          # node generator: installs a proper CLI entry point
          pip3 install --user "$TOOLS_DIR/node"

          # cargo generator: install via poetry as documented, then create a launcher
          pip3 install --user poetry
          poetry -C "$TOOLS_DIR/cargo" install --no-interaction
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/flatpak-cargo-generator" << EOF
          #!/bin/sh
          exec poetry -C "$TOOLS_DIR/cargo" run python3 "$TOOLS_DIR/cargo/flatpak-cargo-generator.py" "\$@"
          EOF
          chmod +x "$HOME/.local/bin/flatpak-cargo-generator"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate Flatpak builder manifest
        env:
          FLATPAK_SOURCE: ${{ steps.source.outputs.flatpak_source }}
        run: node scripts/build-flatpak-builder.ts

      - name: Upload manifest artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-builder
          path: out/make/flatpak-builder/

  publish:
    name: Create Flathub update PR
    needs: build-manifest
    runs-on: ubuntu-latest
    environment:
      name: flathub
      deployment: false

    steps:
      - name: Download manifest artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-builder
          path: flatpak-builder

      - name: Checkout Flathub repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.FLATHUB_REPO }}
          ref: ${{ env.FLATHUB_BASE_BRANCH }}
          token: ${{ secrets.FLATHUB_GITHUB_TOKEN }}
          path: flathub-repo
          # Pushed with an explicit token URL below; keep it out of .git/config.
          persist-credentials: false

      - name: Copy generated files into Flathub repo
        run: |
          find flathub-repo -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r flatpak-builder/. flathub-repo/

      - name: Create pull request in Flathub repository
        working-directory: flathub-repo
        env:
          GH_TOKEN: ${{ secrets.FLATHUB_GITHUB_TOKEN }}
          REPO: ${{ env.FLATHUB_REPO }}
          BASE: ${{ env.FLATHUB_BASE_BRANCH }}
          VERSION: ${{ needs.build-manifest.outputs.version }}
          BRANCH: update/v${{ needs.build-manifest.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Commit as the same bot identity the previous action used.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add --all
          if git diff --cached --quiet; then
            echo "No manifest changes for v${VERSION}; nothing to publish."
            exit 0
          fi

          git commit --message "Open Orpheus v${VERSION}"

          # No persisted credentials: push with the app token in the URL. The
          # branch is generated, so a re-run must be able to replace the commit
          # a previous run pushed. Lease on the value fetched a moment earlier,
          # so a concurrent push fails the job instead of being clobbered.
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          branch_ref="refs/heads/${BRANCH}"
          if git fetch --quiet "$remote" "+${branch_ref}:refs/remotes/update-target"; then
            git push --force-with-lease="${branch_ref}:$(git rev-parse refs/remotes/update-target)" \
              "$remote" "HEAD:${branch_ref}"
          else
            git push "$remote" "HEAD:${branch_ref}"
          fi

          body=$(printf 'Automated Flathub manifest update for Open Orpheus v%s.\n\nSource workflow run:\n%s' \
            "$VERSION" "$RUN_URL")
          existing=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
            --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$REPO" \
              --title "Open Orpheus v${VERSION}" --body "$body"
          else
            gh pr create --repo "$REPO" --head "$BRANCH" --base "$BASE" \
              --title "Open Orpheus v${VERSION}" --body "$body" --assignee YUCLing
          fi
