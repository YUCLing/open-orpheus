name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect relevant changes
    uses: ./.github/workflows/changes.yml

  # Linux only: the packaging snapshots embed POSIX path separators.
  test-node:
    name: Vitest
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.node == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve pinned Rust version
        id: toolchain
        uses: ./.github/actions/toolchain

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.rust }}
          target: wasm32-unknown-unknown

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install wasm-bindgen-cli
        shell: bash
        run: |
          version=$(awk '/^wasm-bindgen =/ { gsub(/"/, "", $3); print $3; exit }' Cargo.toml)
          cargo install "wasm-bindgen-cli@$version"

      - name: Build native modules
        run: pnpm build:modules

      - name: Run tests
        run: pnpm coverage --reporter=default --reporter=github-actions --reporter=junit --outputFile=test-report.junit.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          report_type: test_results
          flags: node
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          flags: node
          token: ${{ secrets.CODECOV_TOKEN }}

  # Linux only: Electron needs an X server, which the runner provides through
  # Xvfb. The suite drives the real app — including downloading the web pack
  # from NetEase's CDN — so it builds the native modules the app loads at
  # runtime and then runs Playwright against the Vite build. Native module
  # changes are exercised through the app as well, hence the `rust` filter.
  test-e2e:
    name: Playwright E2E
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.node == 'true' || needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve pinned Rust version
        id: toolchain
        uses: ./.github/actions/toolchain

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.rust }}
          target: wasm32-unknown-unknown

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install wasm-bindgen-cli
        shell: bash
        run: |
          version=$(awk '/^wasm-bindgen =/ { gsub(/"/, "", $3); print $3; exit }' Cargo.toml)
          cargo install "wasm-bindgen-cli@$version"

      # Electron is Chromium, so Playwright can resolve the shared libraries it
      # links against (and Xvfb) to the runner's distro package names.
      - name: Install Electron runtime dependencies
        run: sudo env "PATH=$PATH" pnpm exec playwright install-deps chromium

      - name: Build native modules
        run: pnpm build:modules

      - name: Run E2E tests
        env:
          # The runner cannot set up Chromium's sandbox (its SUID helper is not
          # setuid, and unprivileged user namespaces are restricted) and Xvfb
          # has no GPU, so the tests launch Electron with these extra switches.
          OPEN_ORPHEUS_E2E_ELECTRON_ARGS: --no-sandbox --disable-gpu
          PLAYWRIGHT_JUNIT_OUTPUT_DIR: test-results
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: junit.xml
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24"
          pnpm e2e --reporter=github,junit

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          report_type: test_results
          files: test-results/junit.xml
          flags: e2e
          token: ${{ secrets.CODECOV_TOKEN }}

  # Linux only: the Rust unit tests cover platform-independent logic plus the
  # cfg(target_os = "linux") protocol codecs, which the macOS/Windows clippy
  # runs never compile. nextest runs them under llvm-cov, so a single pass
  # produces both the coverage data and the JUnit report Codecov ingests.
  test-rust:
    name: Cargo nextest
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve pinned Rust version
        id: toolchain
        uses: ./.github/actions/toolchain

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.rust }}
          # cargo-llvm-cov needs llvm-cov/llvm-profdata from the toolchain.
          components: llvm-tools-preview

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.144

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1

      # The `ci` nextest profile (`.config/nextest.toml`) writes the JUnit
      # report to `target/nextest/ci/junit.xml`, which stays outside
      # `target/llvm-cov-target` where llvm-cov keeps its build artifacts.
      - name: Run tests
        run: cargo llvm-cov nextest --workspace --locked --profile ci --lcov --output-path lcov.info

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          report_type: test_results
          files: target/nextest/ci/junit.xml
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}

  # Generates the Flatpak manifest and actually builds it, so packaging
  # regressions are caught before a release is tagged.
  test-flathub:
    name: Flatpak manifest & build
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.flathub == 'true' }}
    runs-on: ubuntu-latest
    env:
      LINTER_IMAGE: ghcr.io/flathub-infra/flatpak-builder-lint:unprivileged
      # flatpak-builder needs syscalls (user namespaces/bwrap) that Docker's
      # default seccomp profile blocks; this is the profile Flathub runs the
      # unprivileged image with.
      LINTER_SECCOMP_URL: https://raw.githubusercontent.com/flathub-infra/vorarbeiter/57e57bbb3d951c04cea355cb9335f5145d74704d/flatpak.seccomp.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install flatpak build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y flatpak flatpak-builder appstream elfutils

      - name: Install flatpak-node-generator and flatpak-cargo-generator
        run: |
          COMMIT=9d86d336a39b9af38b86f114b6ce5820fe260f91
          TOOLS_DIR=/tmp/flatpak-builder-tools
          git clone --filter=blob:none https://github.com/flatpak/flatpak-builder-tools.git "$TOOLS_DIR"
          git -C "$TOOLS_DIR" checkout "$COMMIT"

          # node generator: installs a proper CLI entry point
          pip3 install --user "$TOOLS_DIR/node"

          # cargo generator: install via poetry as documented, then create a launcher
          pip3 install --user poetry
          poetry -C "$TOOLS_DIR/cargo" install --no-interaction
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/flatpak-cargo-generator" << EOF
          #!/bin/sh
          exec poetry -C "$TOOLS_DIR/cargo" run python3 "$TOOLS_DIR/cargo/flatpak-cargo-generator.py" "\$@"
          EOF
          chmod +x "$HOME/.local/bin/flatpak-cargo-generator"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate Flatpak builder manifest
        run: node scripts/build-flatpak-builder.ts

      - name: Download the linter seccomp profile
        run: curl -fsSL "$LINTER_SECCOMP_URL" -o flatpak.seccomp.json

      - name: Lint the generated manifest
        working-directory: out/make/flatpak-builder
        run: |
          # Targets for the container's TMPDIR/XDG_STATE_HOME below; keep them
          # inside the mount so nothing is written to unwritable paths.
          mkdir -p tmp .local/state
          docker run --rm \
            --security-opt apparmor=unconfined \
            --security-opt seccomp="$GITHUB_WORKSPACE/flatpak.seccomp.json" \
            -v "$PWD:/mnt" \
            -w /mnt \
            -e TMPDIR=/mnt/tmp \
            -e XDG_STATE_HOME=/mnt/.local/state \
            -e GITHUB_ACTIONS \
            "$LINTER_IMAGE" \
            --gha-format --exceptions --exceptions-repo stable \
            manifest io.github.yucling.open-orpheus.yaml

      - name: Set up Flatpak runtimes
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.freedesktop.Platform//26.08 \
            org.freedesktop.Sdk//26.08 \
            org.freedesktop.Sdk.Extension.node24//26.08

      - name: Build the Flatpak
        working-directory: out/make/flatpak-builder
        run: |
          flatpak-builder --user --force-clean --repo=repo \
            --install-deps-from=flathub \
            build-dir io.github.yucling.open-orpheus.yaml

      - name: Lint the built repository
        working-directory: out/make/flatpak-builder
        run: |
          mkdir -p tmp .local/state
          docker run --rm \
            --security-opt apparmor=unconfined \
            --security-opt seccomp="$GITHUB_WORKSPACE/flatpak.seccomp.json" \
            -v "$PWD:/mnt" \
            -v "$GITHUB_WORKSPACE/.github/flatpak-lint-exceptions.json:/flatpak-lint-exceptions.json:ro" \
            -w /mnt \
            -e TMPDIR=/mnt/tmp \
            -e XDG_STATE_HOME=/mnt/.local/state \
            -e GITHUB_ACTIONS \
            "$LINTER_IMAGE" \
            --gha-format --exceptions --exceptions-repo stable \
            --user-exceptions /flatpak-lint-exceptions.json \
            repo repo

  # Always-running gate so the ruleset has a required check even when the
  # test jobs above are skipped by the change filter.
  required:
    name: Test required
    needs: [changes, test-node, test-e2e, test-rust, test-flathub]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
