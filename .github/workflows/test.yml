name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists the PR's changed files

concurrency:
  # Superseded runs on the same PR are useless: cancel them. On main, queue
  # instead, so a run that is already building can still save its caches.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect relevant changes
    uses: $/.github/workflows/changes.yml

  # Linux only: the packaging snapshots embed POSIX path separators.
  test-node:
    name: Vitest
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.node == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: codecov
      deployment: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve pinned Rust version
        id: toolchain
        uses: $/.github/actions/toolchain

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: ${{ steps.toolchain.outputs.rust }}
          target: wasm32-unknown-unknown
          # Share the cargo target directory with the other jobs that build the
          # native modules (E2E, bundle builds). OS/arch stay part of the key.
          cache-shared-key: native-modules

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve wasm-bindgen-cli version
        id: wasm-bindgen
        shell: bash
        run: |
          version=$(awk '/^wasm-bindgen =/ { gsub(/"/, "", $3); print $3; exit }' Cargo.toml)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: wasm-bindgen-cli@${{ steps.wasm-bindgen.outputs.version }}
          # Prebuilt on every platform these jobs use; keep the source build as
          # the fallback so a missing asset never depends on cargo-binstall.
          fallback: cargo-install

      - name: Restore built native modules
        id: modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The .node addons and the wasm bundle are the only non-source
          # artifacts of `build:modules`; the generated JS/d.ts shims are
          # committed, so a checkout already restores them.
          path: |
            modules/*/*.node
            modules/audio-effect/dist
          # The lockfile is part of the key because the napi CLI and the
          # cross toolchain that link the addons are pinned there: bumping
          # either must invalidate the cached binaries.
          # No restore-keys: only an exact hit may skip the build, otherwise a
          # partial restore would silently leave addons missing.
          key: modules-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'Cargo.lock', 'Cargo.toml', '.cargo/config.toml', 'packaging/common/toolchain.ts', 'scripts/build-modules.ts', 'modules/*/Cargo.toml', 'modules/*/package.json', 'modules/*/build.rs', 'modules/*/src/**', 'modules/*/.cargo/config.toml') }}

      - name: Build native modules
        if: steps.modules.outputs.cache-hit != 'true'
        run: pnpm build:modules

      - name: Run tests
        run: pnpm coverage --reporter=default --reporter=github-actions --reporter=junit --outputFile=test-report.junit.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          flags: node
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          flags: node
          token: ${{ secrets.CODECOV_TOKEN }}

  # Linux only: Electron needs an X server, which the runner provides through
  # Xvfb. The suite drives the real app — including downloading the web pack
  # from NetEase's CDN — so it builds the native modules the app loads at
  # runtime and then runs Playwright against the Vite build. Native module
  # changes are exercised through the app as well, hence the `rust` filter.
  test-e2e:
    name: Playwright E2E
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.node == 'true' || needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: codecov
      deployment: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve pinned Rust version
        id: toolchain
        uses: $/.github/actions/toolchain

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: ${{ steps.toolchain.outputs.rust }}
          target: wasm32-unknown-unknown
          # Share the cargo target directory with the other jobs that build the
          # native modules (E2E, bundle builds). OS/arch stay part of the key.
          cache-shared-key: native-modules

      - name: Resolve Electron version
        id: electron
        shell: bash
        run: echo "version=$(node -p "require('./package.json').devDependencies.electron")" >> "$GITHUB_OUTPUT"

      - name: Cache Electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # @electron/get stores the platform zip under env-paths('electron').cache,
          # which both the pnpm postinstall and electron's lazy download use.
          path: ${{ runner.os == 'Linux' && '~/.cache/electron' || runner.os == 'macOS' && '~/Library/Caches/electron' || '~/AppData/Local/electron/Cache' }}
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron.outputs.version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve wasm-bindgen-cli version
        id: wasm-bindgen
        shell: bash
        run: |
          version=$(awk '/^wasm-bindgen =/ { gsub(/"/, "", $3); print $3; exit }' Cargo.toml)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: wasm-bindgen-cli@${{ steps.wasm-bindgen.outputs.version }}
          # Prebuilt on every platform these jobs use; keep the source build as
          # the fallback so a missing asset never depends on cargo-binstall.
          fallback: cargo-install

      # Electron is Chromium, so Playwright can resolve the shared libraries it
      # links against (and Xvfb) to the runner's distro package names.
      - name: Install Electron runtime dependencies
        run: sudo env "PATH=$PATH" pnpm exec playwright install-deps chromium

      - name: Restore built native modules
        id: modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The .node addons and the wasm bundle are the only non-source
          # artifacts of `build:modules`; the generated JS/d.ts shims are
          # committed, so a checkout already restores them.
          path: |
            modules/*/*.node
            modules/audio-effect/dist
          # The lockfile is part of the key because the napi CLI and the
          # cross toolchain that link the addons are pinned there: bumping
          # either must invalidate the cached binaries.
          # No restore-keys: only an exact hit may skip the build, otherwise a
          # partial restore would silently leave addons missing.
          key: modules-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'Cargo.lock', 'Cargo.toml', '.cargo/config.toml', 'packaging/common/toolchain.ts', 'scripts/build-modules.ts', 'modules/*/Cargo.toml', 'modules/*/package.json', 'modules/*/build.rs', 'modules/*/src/**', 'modules/*/.cargo/config.toml') }}

      - name: Build native modules
        if: steps.modules.outputs.cache-hit != 'true'
        run: pnpm build:modules

      - name: Restore cached NetEase installer
        id: installer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The E2E download test streams this file from loopback instead of
          # NetEase's CDN. Unlike the other caches this file has no producer
          # job: the app downloads the installer into memory, so the cache has
          # to be filled by the step below on the first (miss) run.
          path: ${{ runner.temp }}/open-orpheus-package/installer.exe
          key: package-installer-v1-${{ runner.os }}-${{ hashFiles('versions.json') }}

      - name: Fetch NetEase installer
        if: steps.installer.outputs.cache-hit != 'true'
        env:
          INSTALLER: ${{ runner.temp }}/open-orpheus-package/installer.exe
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$INSTALLER")"
          url=$(node -p "require('./versions.json').downloadUrl")
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
            --max-time 900 \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36" \
            --output "$INSTALLER" "$url"
          # A Windows PE of plausible size: never cache an error page or a
          # truncated download, since the entry is shared with later runs.
          test "$(head -c 2 "$INSTALLER")" = "MZ"
          test "$(wc -c < "$INSTALLER")" -gt 50000000

      - name: Run E2E tests
        env:
          # The runner cannot set up Chromium's sandbox (its SUID helper is not
          # setuid, and unprivileged user namespaces are restricted) and Xvfb
          # has no GPU, so the tests launch Electron with these extra switches.
          OPEN_ORPHEUS_E2E_ELECTRON_ARGS: --no-sandbox --disable-gpu
          OPEN_ORPHEUS_E2E_PACKAGE_FILE: ${{ runner.temp }}/open-orpheus-package/installer.exe
          PLAYWRIGHT_JUNIT_OUTPUT_DIR: test-results
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: junit.xml
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24"
          pnpm e2e --reporter=github,junit

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          files: test-results/junit.xml
          flags: e2e
          token: ${{ secrets.CODECOV_TOKEN }}

  # Linux only: the Rust unit tests cover platform-independent logic plus the
  # cfg(target_os = "linux") protocol codecs, which the macOS/Windows clippy
  # runs never compile. nextest runs them under llvm-cov, so a single pass
  # produces both the coverage data and the JUnit report Codecov ingests.
  test-rust:
    name: Cargo nextest
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: codecov
      deployment: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve pinned Rust version
        id: toolchain
        uses: $/.github/actions/toolchain

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: ${{ steps.toolchain.outputs.rust }}
          # cargo-llvm-cov needs llvm-cov/llvm-profdata from the toolchain.
          components: llvm-tools-preview

      - name: Install cargo-nextest
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: nextest@0.9.144

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-llvm-cov@0.9.1

      # The `ci` nextest profile (`.config/nextest.toml`) writes the JUnit
      # report to `target/nextest/ci/junit.xml`, which stays outside
      # `target/llvm-cov-target` where llvm-cov keeps its build artifacts.
      - name: Run tests
        run: cargo llvm-cov nextest --workspace --locked --profile ci --lcov --output-path lcov.info

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          files: target/nextest/ci/junit.xml
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}

  # Generates the Flatpak manifest and actually builds it, so packaging
  # regressions are caught before a release is tagged.
  test-flathub:
    name: Flatpak manifest & build
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.flathub == 'true' }}
    runs-on: ubuntu-latest
    env:
      LINTER_IMAGE: ghcr.io/flathub-infra/flatpak-builder-lint:unprivileged
      # flatpak-builder needs syscalls (user namespaces/bwrap) that Docker's
      # default seccomp profile blocks; this is the profile Flathub runs the
      # unprivileged image with.
      LINTER_SECCOMP_URL: https://raw.githubusercontent.com/flathub-infra/vorarbeiter/57e57bbb3d951c04cea355cb9335f5145d74704d/flatpak.seccomp.json

    steps:
      # Dependency-only bumps still generate and lint the manifest, but the
      # sandbox build (~6.4 min) only runs for packaging changes, on `main` or a
      # manual dispatch, or when a PR carries the ci/full-flatpak-build label.
      - name: Decide whether to run the full build
        id: build
        env:
          EVENT_NAME: ${{ github.event_name }}
          PACKAGING_CHANGED: ${{ needs.changes.outputs.flathub_build }}
          FULL_BUILD_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci/full-flatpak-build') }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ] || [ "$PACKAGING_CHANGED" = "true" ] || [ "$FULL_BUILD_LABEL" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install flatpak build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y flatpak flatpak-builder appstream elfutils

      - name: Install flatpak-node-generator and flatpak-cargo-generator
        run: |
          COMMIT=9d86d336a39b9af38b86f114b6ce5820fe260f91
          TOOLS_DIR=/tmp/flatpak-builder-tools
          git clone --filter=blob:none https://github.com/flatpak/flatpak-builder-tools.git "$TOOLS_DIR"
          git -C "$TOOLS_DIR" checkout "$COMMIT"

          # node generator: installs a proper CLI entry point
          pip3 install --user "$TOOLS_DIR/node"

          # cargo generator: install via poetry as documented, then create a launcher
          pip3 install --user poetry
          poetry -C "$TOOLS_DIR/cargo" install --no-interaction
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/flatpak-cargo-generator" << EOF
          #!/bin/sh
          exec poetry -C "$TOOLS_DIR/cargo" run python3 "$TOOLS_DIR/cargo/flatpak-cargo-generator.py" "\$@"
          EOF
          chmod +x "$HOME/.local/bin/flatpak-cargo-generator"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate Flatpak builder manifest
        run: node scripts/build-flatpak-builder.ts

      - name: Download the linter seccomp profile
        run: curl -fsSL "$LINTER_SECCOMP_URL" -o flatpak.seccomp.json

      - name: Lint the generated manifest
        working-directory: out/make/flatpak-builder
        run: |
          # Targets for the container's TMPDIR/XDG_STATE_HOME below; keep them
          # inside the mount so nothing is written to unwritable paths.
          mkdir -p tmp .local/state
          docker run --rm \
            --security-opt apparmor=unconfined \
            --security-opt seccomp="$GITHUB_WORKSPACE/flatpak.seccomp.json" \
            -v "$PWD:/mnt" \
            -w /mnt \
            -e TMPDIR=/mnt/tmp \
            -e XDG_STATE_HOME=/mnt/.local/state \
            -e GITHUB_ACTIONS \
            "$LINTER_IMAGE" \
            --gha-format --exceptions --exceptions-repo stable \
            manifest io.github.yucling.open-orpheus.yaml

      - name: Set up Flatpak runtimes
        if: steps.build.outputs.build == 'true'
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.freedesktop.Platform//26.08 \
            org.freedesktop.Sdk//26.08 \
            org.freedesktop.Sdk.Extension.node24//26.08

      - name: Build the Flatpak
        if: steps.build.outputs.build == 'true'
        working-directory: out/make/flatpak-builder
        run: |
          flatpak-builder --user --force-clean --repo=repo \
            --install-deps-from=flathub \
            build-dir io.github.yucling.open-orpheus.yaml

      - name: Lint the built repository
        if: steps.build.outputs.build == 'true'
        working-directory: out/make/flatpak-builder
        run: |
          mkdir -p tmp .local/state
          docker run --rm \
            --security-opt apparmor=unconfined \
            --security-opt seccomp="$GITHUB_WORKSPACE/flatpak.seccomp.json" \
            -v "$PWD:/mnt" \
            -v "$GITHUB_WORKSPACE/.github/flatpak-lint-exceptions.json:/flatpak-lint-exceptions.json:ro" \
            -w /mnt \
            -e TMPDIR=/mnt/tmp \
            -e XDG_STATE_HOME=/mnt/.local/state \
            -e GITHUB_ACTIONS \
            "$LINTER_IMAGE" \
            --gha-format --exceptions --exceptions-repo stable \
            --user-exceptions /flatpak-lint-exceptions.json \
            repo repo
