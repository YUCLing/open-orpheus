coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: 70%
        threshold: 0%
        informational: true

# Each language uploads under its own flag, and the two test jobs are gated on
# path filters, so a PR touching only one language uploads only one flag.
# Carryforward keeps the missing flag's coverage from the base commit instead of
# comparing against a report that never covered those files (default: false).
flag_management:
  default_rules:
    carryforward: true
