packages:
  - "."
  - "gui/"
  - "modules/*"
catalog:
  "@electron/fuses": ^2.1.3
  keyv: 6.1.0
  typescript: ~6.0.3
allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  unrs-resolver: true
patchedDependencies:
  # 上游核心修复：IPC 分帧、连接取消和关闭清理
  # 本地保留：套接字归属/类型校验、目录回退及异常帧限制
  "@discordjs/rpc@0.2.0-dev.1794009739-5bb74922a": patches/@discordjs__rpc@0.2.0-dev.1794009739-5bb74922a.patch
  # Drop other adapter support, as we always use node:sqlite
  "@keyv/sqlite": patches/@keyv__sqlite.patch
  # Make it search for toolchain in node_modules too
  "@napi-rs/cross-toolchain": patches/@napi-rs__cross-toolchain.patch
blockExoticSubdeps: false
nodeLinker: hoisted
overrides:
  # See https://github.com/electron/electron/issues/51619
  "yauzl@2.10.0": "^3.3.1"
  # Got (cacheable-request) uses Keyv 5, but we are using v6, they are mostly compatible, we are overriding it here, and patch cacheable-request
  "got>keyv": "catalog:"
  "cacheable-request>keyv": "catalog:"
  # Our environment is locked to Node.JS 24+, so there will always be node:sqlite
  "@keyv/sqlite>better-sqlite3": "-"
  "@keyv/sqlite>sqlite3": "-"
  # Safe to upgrade (no actual breaking changes for this project)
  "@electron-forge/plugin-fuses>@electron/fuses": "catalog:"
minimumReleaseAgeExclude:
  # I believe electron's releases are very trustable
  - electron
