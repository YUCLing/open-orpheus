[workspace]
members = [
  "modules/database",
  "modules/window",
  "modules/ui",
  "modules/audio-effect",
  "modules/dbus",
  "modules/sys-win32",
  "modules/nowplaying",
  "modules/av3a",
]
resolver = "3"

[workspace.dependencies]
napi = "3.0.0"
napi-derive = "3.0.0"
wasm-bindgen = "0.2.130"

[patch.crates-io]
# Our patch makes freetype-sys use libz-sys's headers
freetype-sys = { git = "https://github.com/YUCLing/freetype-sys.git", rev = "a6b10931605e38918528e048952067e1c3abdeec" }

[profile.release]
lto = true
strip = "symbols"
